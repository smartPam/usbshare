name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publikacja wydań (Release) z plikiem .exe
  packages: write   # publikacja obrazu w ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: GOOS=windows go vet ./cmd/usbshare-client
      - run: go test ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        run: |
          V="${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)"
          [[ "$GITHUB_REF" == refs/tags/* ]] && V="${GITHUB_REF_NAME}"
          mkdir -p dist
          export CGO_ENABLED=0
          LD="-s -w -X main.version=${V}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LD -H=windowsgui" -o dist/usbshare-client-windows-amd64.exe ./cmd/usbshare-client
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "$LD -H=windowsgui" -o dist/usbshare-client-windows-arm64.exe ./cmd/usbshare-client
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$LD" -o dist/usbshare-client-linux-amd64 ./cmd/usbshare-client
          for a in amd64 arm64; do
            GOOS=linux GOARCH=$a go build -trimpath -ldflags "$LD" -o dist/usbshare-server-linux-$a ./cmd/usbshare-server
          done
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "$LD" -o dist/usbshare-server-linux-armv7 ./cmd/usbshare-server
          cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: usbshare-binaries
          path: dist/*
      - name: Wydanie "latest" (każdy push do main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* --target "$GITHUB_SHA" --latest \
            --title "USBShare – najnowsza wersja" \
            --notes "Automatyczne wydanie z gałęzi main (commit ${GITHUB_SHA::7}). Klient Windows: usbshare-client-windows-amd64.exe. Serwer: zobacz README (instalacja przez Docker)."
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/usbshare-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
